<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="63mm" viewBox="0 0 1800 630">
  <title>SoilAgent-R: evidence-grounded architecture</title>
  <desc>Four user-selected agent responsibility groups cover five tool/model modules: site cognition covers Auto-ETL and CSM; digital twin, prediction and decision cover Digital twin, RTM and MOPSO respectively. The frames express responsibility, not verified independent autonomous runtimes. Structure draft pending review. The digital twin is a conceptual illustration, not to scale and not a measured field. Dashed links denote methodological guidance or user revision. Decision axes contain no candidate data. Empty axes show CONC, COST and FLUX; TIME remains a fourth optimization objective, not shown in this placeholder.</desc>
  <g id="canvas" font-family="Arial" font-weight="700" font-size="26" fill="#303840" stroke-linejoin="round" stroke-linecap="round">
    <rect width="1800" height="630" fill="white"/>
    <g id="research-input" data-role="input">
      <text x="60" y="90" font-size="30">Research goal / site information</text>
      <path d="M160 107 L160 112" fill="none" stroke="#56616a" stroke-width="2"/>
      <polygon points="160,120 153,107 167,107" fill="#56616a"/>
    </g>
    <g id="user-feedback" data-source="decision" data-target="research-input" data-status="manual" stroke="#8b949b" stroke-width="2" stroke-dasharray="9 7" fill="none">
      <path d="M1740 120 L1740 48 L540 48 L540 77"/>
      <polygon points="540,85 533,72 547,72" fill="#8b949b" stroke="none"/>
      <text x="1100" y="38" text-anchor="middle" fill="#66717a" stroke="none">User revises goals</text>
    </g>
    <g id="agent-scopes" data-status="user-selected-responsibility-grouping">
      <g id="site-agent" data-role="agent-scope" data-modules="etl,csm">
        <rect x="60" y="120" width="475" height="45" fill="none" stroke="#8b949b" stroke-width="1.5"/>
        <text id="site-agent-label" x="297.5" y="151" text-anchor="middle">Site cognition agent</text>
      </g>
      <g id="twin-agent" data-role="agent-scope" data-modules="twin">
        <rect x="670" y="120" width="360" height="45" fill="none" stroke="#8b949b" stroke-width="1.5"/>
        <text id="twin-agent-label" x="850" y="151" text-anchor="middle">Digital twin agent</text>
      </g>
      <g id="prediction-agent" data-role="agent-scope" data-modules="rtm">
        <rect x="1150" y="120" width="250" height="45" fill="none" stroke="#8b949b" stroke-width="1.5"/>
        <text id="prediction-agent-label" x="1275" y="151" text-anchor="middle">Prediction agent</text>
      </g>
      <g id="decision-agent" data-role="agent-scope" data-modules="decision">
        <rect x="1500" y="120" width="280" height="45" fill="none" stroke="#8b949b" stroke-width="1.5"/>
        <text id="decision-agent-label" x="1640" y="151" text-anchor="middle">Decision agent</text>
      </g>
    </g>
    <g id="etl" data-role="module" data-width="200">
      <text id="etl-method-label" data-role="module-title" x="160" y="200" text-anchor="middle" font-size="31">0 Auto-ETL</text>
      <g id="etl-documents" transform="translate(0 -28)" stroke="#66717a" stroke-width="2" fill="none">
        <path d="M78 316 L143 316 L166 339 L166 412 L78 412 Z M143 316 L143 339 L166 339"/>
        <path d="M94 354 L146 354 M94 372 L146 372 M94 390 L129 390"/>
        <rect x="117" y="438" width="113" height="76" rx="2" fill="white"/>
        <path d="M117 464 L230 464 M117 489 L230 489 M155 438 L155 514 M192 438 L192 514"/>
      </g>
      <g id="etl-annotations" data-role="module-annotations" data-final-baseline="590">
        <text x="160" y="550" text-anchor="middle">Normalize / QC</text>
        <text x="160" y="590" text-anchor="middle">Provenance</text>
      </g>
    </g>
    <g id="csm" data-role="module" data-width="210">
      <text id="csm-method-label" data-role="module-title" x="425" y="200" text-anchor="middle" font-size="31">1 CSM</text>
      <g id="csm-profile" stroke="#66717a" stroke-width="2" fill="none">
        <path d="M323 368 L533 368 M323 438 L533 438 M323 508 L533 508"/>
        <path d="M337 367 L337 290 L366 290 L366 367 M333 291 L370 291"/>
        <path d="M356 401 C395 395 425 419 465 414 L502 414"/>
        <polygon points="509,414 496,407 496,421" fill="#66717a" stroke="none"/>
        <path d="M497 367 L497 318 L514 302 L531 318 L531 367"/>
      </g>
      <g id="csm-annotations" data-role="module-annotations" data-final-baseline="590">
        <text x="425" y="550" text-anchor="middle">Source / Pathway</text>
        <text x="425" y="590" text-anchor="middle">Receptor</text>
      </g>
    </g>
    <g id="twin" data-role="module" data-width="520">
      <text id="twin-method-label" data-role="module-title" x="850" y="200" text-anchor="middle" font-size="34" fill="#45656a">2 Digital twin</text>
      <g id="conceptual-soil-block" transform="translate(0 -44)" stroke="#708388" stroke-width="2" fill="none">
        <path d="M636 387 L954 387 L1075 304 L756 304 Z" fill="#f3f6f6"/>
        <path d="M636 387 L954 387 L954 552 L636 552 Z" fill="#fafbfb"/>
        <path d="M954 387 L1075 304 L1075 469 L954 552 Z" fill="#eef2f3"/>
        <path d="M636 442 L954 442 L1075 359 M636 497 L954 497 L1075 414"/>
        <path d="M704 387 L704 552 M768 387 L768 552 M832 387 L832 552 M896 387 L896 552" stroke="#d4dedf"/>
        <path d="M756 304 L636 387 M820 304 L700 387 M884 304 L764 387 M948 304 L828 387 M1012 304 L892 387" stroke="#d4dedf"/>
        <path d="M716 332 C750 315 838 314 858 334 C882 343 917 337 934 350 C955 371 898 381 852 372 C814 356 765 378 736 365 C718 357 703 346 716 332 Z" fill="#dbe8e6" stroke="#7b9b96"/>
        <path d="M715 404 C744 393 799 397 819 416 C848 426 866 415 885 435 C900 460 867 486 841 481 C804 464 778 481 748 465 C719 446 733 426 715 404 Z" fill="#e5eeec" stroke="#91aaa5"/>
      </g>
      <g id="twin-parameter-fields" data-role="module-annotations" data-final-baseline="590" data-fields="K,Kd,alpha,lambda,lambda_active,R,v,D">
        <text id="twin-fields-row-1" x="787.61" y="550" data-center-x="850" text-anchor="start">K, K<tspan font-size="22" dy="8">d</tspan><tspan dy="-8">, α, λ</tspan></text>
        <text id="twin-fields-row-2" x="763.90" y="590" data-center-x="850" text-anchor="start">λ<tspan font-size="22" dy="8">active</tspan><tspan dy="-8">, R, v, D</tspan></text>
      </g>
    </g>
    <g id="rtm" data-role="module" data-width="210">
      <text id="rtm-method-label" data-role="module-title" x="1275" y="200" text-anchor="middle" font-size="31">3 RTM</text>
      <g id="rtm-time-states" stroke="#66717a" stroke-width="2" fill="none">
        <rect x="1196" y="288" width="108" height="55"/>
        <path d="M1232 288 L1232 343 M1268 288 L1268 343 M1196 315 L1304 315"/>
        <rect x="1196" y="414" width="108" height="55"/>
        <path d="M1232 414 L1232 469 M1268 414 L1268 469 M1196 441 L1304 441"/>
        <path d="M1250 355 L1250 394"/>
        <polygon points="1250,401 1244,391 1256,391" fill="#66717a" stroke="none"/>
      </g>
      <text id="rtm-time-0" x="1320" y="324" data-time-index="0">t<tspan font-size="22" dy="8">0</tspan></text>
      <text id="rtm-time-1" x="1320" y="450" data-time-index="1">t<tspan font-size="22" dy="8">1</tspan></text>
      <g id="rtm-equations" data-role="module-annotations" data-final-baseline="590">
        <g id="rtm-balance-equation" data-law="cell-mass-balance" data-equation="dM/dt = −∑F − r" data-center-x="1275" data-equals-x="1242" data-baseline="574">
          <text id="rtm-balance-numerator" x="1208" y="554" text-anchor="middle">dM</text>
          <path id="rtm-fraction-rule" d="M1184 563 L1232 563" stroke="#303840" stroke-width="1.5" fill="none"/>
          <text id="rtm-balance-denominator" x="1208" y="590" text-anchor="middle">dt</text>
          <text id="rtm-balance-equals" x="1242" y="574">=</text>
          <text id="rtm-balance-rhs" x="1270" y="574">−∑F − r</text>
        </g>
      </g>
    </g>
    <g id="decision" data-role="module" data-width="300">
      <text id="decision-method-label" data-role="module-title" x="1640" y="200" text-anchor="middle" font-size="31">4 MOPSO</text>
      <g id="decision-axes" data-state="empty-placeholder" stroke="#66717a" stroke-width="2" fill="none">
        <path d="M1545 417 L1725 459 M1545 417 L1627 342 M1545 417 L1545 280"/>
        <polygon points="1732,461 1720,451 1716,465" fill="#66717a" stroke="none"/>
        <polygon points="1634,336 1618,340 1628,351" fill="#66717a" stroke="none"/>
        <polygon points="1545,272 1538,285 1552,285" fill="#66717a" stroke="none"/>
        <text id="decision-axis-conc" x="1685" y="493" fill="#303840" stroke="none">CONC</text>
        <text x="1642" y="328" fill="#303840" stroke="none">COST</text>
        <text x="1545" y="252" text-anchor="middle" fill="#303840" stroke="none">FLUX</text>
      </g>
    </g>
    <g id="etl-to-csm" data-source="etl" data-target="csm" stroke="#56616a" stroke-width="2" fill="none">
      <path d="M270 187 L313 187"/>
      <polygon points="321,187 308,180 308,194" fill="#56616a" stroke="none"/>
    </g>
    <g id="csm-to-twin" data-source="csm" data-target="twin" data-status="method-guidance" stroke="#8b949b" stroke-width="2" stroke-dasharray="8 6" fill="none">
      <path d="M530 187 L683 187"/>
      <polygon points="691,187 678,180 678,194" fill="#8b949b" stroke="none"/>
    </g>
    <g id="twin-to-rtm" data-source="twin" data-target="rtm" stroke="#56616a" stroke-width="2" fill="none">
      <path d="M1040 187 L1163 187"/>
      <polygon points="1171,187 1158,180 1158,194" fill="#56616a" stroke="none"/>
    </g>
    <g id="rtm-to-decision" data-source="rtm" data-target="decision" stroke="#56616a" stroke-width="2" fill="none">
      <path d="M1375 346 L1490 346"/>
      <polygon points="1498,346 1485,339 1485,353" fill="#56616a" stroke="none"/>
      <text id="model-response-label" x="1432" y="328" text-anchor="middle" fill="#303840" stroke="none">Outputs</text>
    </g>
    <g id="decision-to-rtm" data-source="decision" data-target="rtm" stroke="#56616a" stroke-width="2" fill="none">
      <path d="M1490 427 L1375 427"/>
      <polygon points="1367,427 1380,420 1380,434" fill="#56616a" stroke="none"/>
      <text id="candidate-request-label" x="1432" y="409" text-anchor="middle" fill="#303840" stroke="none">Plans</text>
    </g>
    <g id="decision-output" data-role="output" data-source="decision" data-target="output" data-final-baseline="590">
      <path d="M1640 522 L1640 550" stroke="#56616a" stroke-width="2" fill="none"/>
      <polygon points="1640,558 1633,545 1647,545" fill="#56616a"/>
      <text id="candidate-schemes-label" x="1640" y="590" text-anchor="middle">Candidate schemes</text>
    </g>
  </g>
</svg>
